
name: Build JARVIS Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar arquivos do projeto
        run: |
          echo "Conteúdo da raiz:"
          ls -la
          echo "Manifesto Android:"
          find . -name AndroidManifest.xml -print
          echo "Arquivos Gradle:"
          find . -maxdepth 3 \( -name 'build.gradle' -o -name 'settings.gradle' \) -print

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verificar APK
        run: |
          find . -type f -name '*.apk' -print
          test -n "$(find . -type f -name '*.apk' -print -quit)" || {
            echo "ERRO: Nenhum APK foi gerado."
            exit 1
          }

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
