HTML

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02060d">
<title>J.A.R.V.I.S.</title>
<style>
:root{--void:#02060d;--ice:#5cf2ff;--plasma:#8a6bff;--amber:#ffb454;--ok:#4dffbf;--line:rgba(92,242,255,.22);--text:#dff6ff;--dim:#6f93ad;--mono:ui-monospace,monospace;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--void);color:var(--text);font-family:var(--sans);overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 3px,rgba(92,242,255,.025) 3px 4px)}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 38%,transparent 35%,rgba(0,0,0,.75))}
main{position:relative;z-index:2;height:100%;max-width:720px;margin:auto;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.hud{display:flex;justify-content:space-between;font:11px/1.5 var(--mono);color:var(--dim)}
.hud b{color:var(--ice);font-weight:500}.hud .r{text-align:right}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);margin-right:6px}.led.off{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.stage{flex:1;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.stage h1{font:200 clamp(26px,8vw,40px)/1 var(--sans);letter-spacing:.5em;padding-left:.5em;color:#fff;text-shadow:0 0 28px var(--ice)}
.state{margin-top:10px;font:12px var(--mono);letter-spacing:.2em;color:var(--ice);min-height:18px}
.wave{display:flex;gap:3px;align-items:center;height:26px;margin-top:8px}
.wave i{width:2px;height:3px;background:var(--ice);border-radius:2px;opacity:.5;transition:height .08s}
.panel{border:1px solid var(--line);background:linear-gradient(160deg,rgba(6,22,40,.78),rgba(2,8,18,.82));backdrop-filter:blur(10px);border-radius:4px;overflow:hidden}
.panel:before{content:"";display:block;height:2px;width:34px;background:var(--ice);box-shadow:0 0 10px var(--ice)}
.phead{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line);font:11px var(--mono);color:var(--dim)}
.phead button{font:inherit;color:var(--dim);background:none;border:0;padding:2px 6px}
.log{max-height:min(38vh,320px);min-height:70px;overflow-y:auto;padding:12px 14px;scrollbar-width:thin}
.msg{margin-bottom:14px;font-size:14px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}
.msg:last-child{margin-bottom:0}.who{display:block;font:11px var(--mono);color:var(--ice);margin-bottom:2px}
.msg.user .who{color:var(--plasma)}.msg.sys .who{color:var(--amber)}.msg.user{color:#c9c3ff}
.dock{display:flex;gap:8px;margin-top:10px;align-items:stretch}
.dock input{flex:1;min-width:0;background:rgba(2,9,20,.85);border:1px solid var(--line);border-radius:4px;color:#fff;padding:13px;font:15px var(--sans);outline:none}
.dock input:focus{border-color:var(--ice)}
.btn{border:1px solid var(--line);background:rgba(8,28,50,.8);color:var(--text);border-radius:4px;min-width:48px;padding:0 14px;font:13px var(--mono);cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
.btn.mic{width:56px;padding:0;border-color:var(--ice);font-size:20px}
body.listening .btn.mic{background:rgba(10,90,80,.6);border-color:var(--ok)}
.btn.on{border-color:var(--ok);color:var(--ok)}
.tools{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;align-items:center;font:11px var(--mono);color:var(--dim)}
.tools label{display:flex;align-items:center;gap:6px}.tools input[type=range]{accent-color:var(--ice);width:75px}
.tools .btn{min-width:0;padding:7px 9px;font-size:11px}
@media(max-height:640px){.stage h1{font-size:22px}.log{max-height:24vh}}
</style>
</head>
<body>
<canvas id="bg"></canvas><div class="vignette"></div>
<main>
  <div class="hud">
    <div><span class="led" id="led"></span><b>NÚCLEO ATIVO</b><br>LAT <span id="lat">--</span> ms</div>
    <div class="r"><b id="clock">--:--:--</b><br><span id="date"></span></div>
  </div>
  <section class="stage">
    <h1>JARVIS</h1><div class="state" id="state">PRONTO</div><div class="wave" id="wave"></div>
  </section>
  <section class="panel">
    <div class="phead"><span>COMUNICAÇÃO</span><button id="clear">limpar</button></div>
    <div class="log" id="log"></div>
  </section>
  <div class="dock">
    <button class="btn mic" id="mic" aria-label="Falar">🎙</button>
    <input id="text" placeholder="Digite um comando…" autocomplete="off" enterkeyhint="send">
    <button class="btn" id="send">Enviar</button>
  </div>
  <div class="tools">
    <button class="btn" data-q="Como está o clima hoje?">Clima</button>
    <button class="btn" data-q="Quais são as principais notícias de hoje no Brasil?">Notícias</button>
    <button class="btn" data-q="Qual a cotação do dólar hoje?">Dólar</button>
    <button class="btn" data-q="Que horas são e que dia é hoje?">Hora</button>
    <button class="btn" id="wake">Ativação "Jarvis": off</button>
    <button class="btn" id="conv">Conversa contínua: off</button>
    <button class="btn" id="diag">Diagnóstico</button>
    <button class="btn" id="repeat">Repetir</button>
    <button class="btn" id="stop">Parar voz</button>
    <label>Velocidade <input type="range" id="rate" min="0.8" max="1.3" step="0.05" value="1"></label>
  </div>
</main>
<script>
"use strict";

/* CONFIGURAÇÃO */
const WORKER_URL="https://still-grass-fbf7.bartmeuadriano.workers.dev/";
const MODEL="nvidia/nemotron-3.5-super-vl-120b-a12b";
const $=id=>document.getElementById(id);
const enc=encodeURIComponent;
const logEl=$("log"),stateEl=$("state"),micBtn=$("mic"),textEl=$("text"),sendBtn=$("send");
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone;

const store={
 get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

let mode="idle",busy=false,lastReply="",recognition=null,speechToken=0;
let continuous=store.get("continuous",false),rate=store.get("rate",1);
let wake=store.get("wake",false),wakeRec=null,awaitCmd=false,awaitUntil=0,ignoreUntil=0,wakeLock=null;
let history=store.get("history",[]).slice(-12),lastSources=[];

const SYSTEM_PROMPT=
"Você é JARVIS, assistente pessoal em português brasileiro, natural, inteligente e objetivo. "+
"Responda rapidamente. Perguntas simples: uma ou duas frases. Não faça introduções longas. "+
"Perguntas complexas: dê a informação essencial e só detalhe quando necessário. "+
"Não use Markdown, tabelas, asteriscos ou emojis, pois a resposta será falada em voz alta. "+
"Não invente fatos, notícias, fontes ou ações. Se não souber, admita. "+
"Use dados auxiliares atuais quando fornecidos. Não repita a pergunta do usuário.";

function greeting(){const h=new Date().getHours();return h<5?"Boa madrugada":h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"}
function tick(){
 const d=new Date();$("clock").textContent=d.toLocaleTimeString("pt-BR");
 $("date").textContent=d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"});
}
tick();setInterval(tick,1000);

function addMsg(who,text,type){
 const m=document.createElement("div");m.className="msg "+(type||"");
 const w=document.createElement("span");w.className="who";w.textContent=who;
 const b=document.createElement("span");b.textContent=String(text);
 m.append(w,b);logEl.appendChild(m);logEl.scrollTop=logEl.scrollHeight;
}
function setMode(m,label){
 mode=m;document.body.classList.toggle("listening",m==="listening");
 stateEl.textContent=label||(m==="idle"&&wake?'AGUARDANDO "JARVIS"':({idle:"PRONTO",listening:"OUVINDO",thinking:"PROCESSANDO",speaking:"RESPONDENDO"}[m]||m));
}
function renderHistory(){
 logEl.textContent="";addMsg("JARVIS",greeting()+", senhor. Sistemas prontos.");
 history.forEach(m=>addMsg(m.role==="user"?"SENHOR":"JARVIS",m.content,m.role==="user"?"user":""));
}
function showErr(m){addMsg("ERRO",m,"sys")}
window.addEventListener("error",e=>showErr((e.message||"Erro")+", linha "+(e.lineno||"?")));
window.addEventListener("unhandledrejection",e=>showErr(String(e.reason?.message||e.reason||"Erro inesperado")));

/* VOZ: fala sem criar uma fila enorme de frases */
function cleanForSpeech(t){
 return String(t).replace(/J\.?\s*A\.?\s*R\.?\s*V\.?\s*I\.?\s*S\.?/gi,"Jarvis")
 .replace(/https?:\/\/\S+/gi,"link").replace(/```[\s\S]*?```/g,"")
 .replace(/\[([^\]]+)\]\([^)]+\)/g,"$1").replace(/[*_~`#>]/g,"")
 .replace(/^\s*[-•]\s+/gm,"").replace(/\s+/g," ").trim();
}
function ptVoice(){
 if(!("speechSynthesis" in window))return null;
 const v=speechSynthesis.getVoices();
 return v.find(x=>/pt-BR/i.test(x.lang)&&/Google|Natural|Online/i.test(x.name))
 ||v.find(x=>/pt-BR/i.test(x.lang))||v.find(x=>/^pt/i.test(x.lang))||null;
}
function speak(text){
 if(!("speechSynthesis" in window)){finishSpeaking();return}
 const clean=cleanForSpeech(text);if(!clean){finishSpeaking();return}
 const token=++speechToken;speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(clean);
 u.lang="pt-BR";u.rate=rate;u.pitch=.96;
 const v=ptVoice();if(v)u.voice=v;
 u.onstart=()=>{if(token===speechToken)setMode("speaking")};
 u.onend=()=>{if(token===speechToken)finishSpeaking()};
 u.onerror=()=>{if(token===speechToken)finishSpeaking()};
 speechSynthesis.speak(u);
}
function finishSpeaking(){
 ignoreUntil=Date.now()+800;setMode("idle");
 if(continuous&&!busy&&!wake)setTimeout(startListening,250);
}
function stopSpeaking(){
 speechToken++;ignoreUntil=Date.now()+500;
 if("speechSynthesis" in window)speechSynthesis.cancel();
 setMode("idle","VOZ PARADA");
}
let actx=null;
function beep(){
 try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();
 const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.07;
 o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.1)}catch(e){}
}

/* REDE: timeout curto e mensagens claras */
async function fetchTimed(url,ms=5000){
 const c=new AbortController(),timer=setTimeout(()=>c.abort(),ms);
 try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error("HTTP "+r.status);return r}
 finally{clearTimeout(timer)}
}
async function getJSON(url,ms=5000){return await(await fetchTimed(url,ms)).json()}
function withTimeout(p,ms){
 let timer;
 return Promise.race([p,new Promise((_,rej)=>timer=setTimeout(()=>rej(new Error("tempo esgotado")),ms))])
 .finally(()=>clearTimeout(timer));
}
const WCODE={0:"céu limpo",1:"quase limpo",2:"parcialmente nublado",3:"nublado",45:"neblina",48:"neblina",51:"garoa fraca",53:"garoa",55:"garoa forte",61:"chuva fraca",63:"chuva",65:"chuva forte",71:"neve fraca",73:"neve",75:"neve forte",80:"pancadas fracas",81:"pancadas de chuva",82:"pancadas fortes",95:"trovoadas",96:"trovoadas com granizo",99:"trovoadas fortes com granizo"};

async function geocode(name){
 const d=await getJSON("https://geocoding-api.open-meteo.com/v1/search?count=1&language=pt&name="+enc(name),5000);
 const r=d.results&&d.results[0];if(!r)throw new Error("Cidade não encontrada: "+name);
 return {lat:r.latitude,lon:r.longitude,name:r.name+(r.admin1?", "+r.admin1:""),tz:r.timezone};
}
function myPlace(){
 const saved=store.get("place",null);
 return new Promise(resolve=>{
  if(!navigator.geolocation)return resolve(saved);
  navigator.geolocation.getCurrentPosition(p=>{
   const o={lat:p.coords.latitude,lon:p.coords.longitude,name:"sua localização",tz:TZ};
   store.set("place",o);resolve(o);
  },()=>resolve(saved),{timeout:2500,maximumAge:3600000});
 });
}
function cityFrom(text){
 const m=String(text).match(/\b(?:em|para|na|no|de|do|da)\s+([^?!.,]+?)\s*(?:[?!.,]|$)/i);
 if(!m)return "";
 const c=m[1].replace(/\b(hoje|amanh[aã]|agora|depois|esta|essa|nesta|neste|semana|tarde|noite|manh[aã])\b.*$/i,"").trim();
 return /^(hoje|amanh|agora|semana|casa|mim|voc[eê])/i.test(c)?"":c;
}
const RE={
 time:/\b(que horas|horas s[aã]o|hora (?:agora|atual|certa)|que dia|data de hoje|qual a data|dia da semana)\b/i,
 weather:/\b(clima|tempo (?:hoje|amanh|agora|est[aá]|vai|em|para)|previs[aã]o|temperatura|chover|chuva|vai chover|calor|frio|umidade)\b/i,
 money:/\b(d[oó]lar|euro|bitcoin|cota[cç][aã]o|c[aâ]mbio)\b/i
};

async function toolWeather(text){
 const c=cityFrom(text),place=c?await geocode(c):await myPlace();
 if(!place)throw new Error("Diga sua cidade para consultar o clima.");
 const d=await getJSON("https://api.open-meteo.com/v1/forecast?latitude="+place.lat+"&longitude="+place.lon+"&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=2",6500);
 const x=d.current,q=d.daily;
 return "Em "+place.name+", agora faz "+Math.round(x.temperature_2m)+" graus, sensação de "+Math.round(x.apparent_temperature)+" graus, "+(WCODE[x.weather_code]||"condição não identificada")+", umidade de "+x.relative_humidity_2m+" por cento e vento de "+Math.round(x.wind_speed_10m)+" quilômetros por hora. Hoje: mínima de "+Math.round(q.temperature_2m_min[0])+" e máxima de "+Math.round(q.temperature_2m_max[0])+" graus. Chance de chuva: "+(q.precipitation_probability_max[0]??"não informada")+" por cento.";
}
async function toolMoney(){
 const d=await getJSON("https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL",5000);
 const a=d.USDBRL,b=d.EURBRL,c=d.BTCBRL;
 return "Cotação atual consultada. Dólar: "+Number(a.bid).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})+". Euro: "+Number(b.bid).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})+". Bitcoin: "+Number(c.bid).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})+". Os valores podem variar durante o dia.";
}
async function toolTime(text){
 const c=cityFrom(text);let tz=TZ,nome="sua região";
 if(c){const g=await geocode(c);tz=g.tz;nome=g.name}
 const d=new Date();
 return "Em "+nome+", agora são "+d.toLocaleTimeString("pt-BR",{timeZone:tz,hour:"2-digit",minute:"2-digit"})+". Hoje é "+d.toLocaleDateString("pt-BR",{timeZone:tz,weekday:"long",day:"numeric",month:"long",year:"numeric"})+".";
}

/* PESQUISA: usada somente quando solicitada ou quando o assunto é notícia atual */
async function searchNews(q){
 const rss="https://news.google.com/rss/search?q="+enc(q)+"&hl=pt-BR&gl=BR&ceid=BR:pt-419";
 const d=await getJSON("https://api.rss2json.com/v1/api.json?rss_url="+enc(rss),7000);
 const items=(d.items||[]).slice(0,4);
 if(!items.length)throw new Error("Não encontrei notícias neste momento.");
 return "Notícias encontradas no Google Notícias: "+items.map(i=>i.title+(i.pubDate?" ("+new Date(i.pubDate).toLocaleDateString("pt-BR")+")":"")).join(". ");
}
async function searchWiki(q){
 const d=await getJSON("https://pt.wikipedia.org/w/api.php?action=query&list=search&srlimit=2&format=json&origin=*&srsearch="+enc(q),4500);
 const hit=d?.query?.search?.[0];if(!hit)return "";
 const e=await getJSON("https://pt.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&exsentences=3&format=json&origin=*&titles="+enc(hit.title),4500);
 const pages=Object.values(e?.query?.pages||{}),txt=pages[0]?.extract;
 return txt?"Wikipédia, "+hit.title+": "+txt:"";
}
const NEWS_RE=/\b(not[ií]cias?|manchetes?|aconteceu|acontecendo|[uú]ltimas notícias)\b/i;
const SMALL_RE=/^(oi|ol[aá]|obrigad[oa]|valeu|tudo bem|bom dia|boa tarde|boa noite|ok|certo|sim|n[aã]o|tchau|at[eé] mais)\b/i;

async function getLiveContext(text){
 const explicit=/\b(pesquise|pesquisar|pesquisa na internet|procure na internet|busque na internet|na web|fontes atuais)\b/i.test(text);
 const current=/\b(hoje|agora|atualizado|atualizada|últimas notícias|ultimas noticias|neste momento)\b/i.test(text);
 if(NEWS_RE.test(text)){
  try{return "Dados atuais: "+await searchNews(text)}catch(e){return "A consulta de notícias falhou. Não invente notícias; informe que não foi possível consultar agora."}
 }
 if(!explicit&&!current)return "";
 const q=text.replace(/^(por favor[, ]*)?(pesquise|pesquisar|pesquisa|procure|buscar|busque)\s*(na internet|na web)?\s*/i,"").trim();
 try{
  const x=await withTimeout(searchWiki(q),5000);
  if(x)return "Informação de referência: "+x;
 }catch(e){}
 return "";
}

/* COMANDOS DE APLICATIVOS */
const APPS={
 "whatsapp":"com.whatsapp","whatsapp business":"com.whatsapp.w4b",
 "youtube":"com.google.android.youtube","youtube music":"com.google.android.apps.youtube.music",
 "chrome":"com.android.chrome","google":"com.google.android.googlequicksearchbox",
 "mapas":"com.google.android.apps.maps","google maps":"com.google.android.apps.maps","waze":"com.waze",
 "gmail":"com.google.android.gm","instagram":"com.instagram.android","facebook":"com.facebook.katana",
 "telegram":"org.telegram.messenger","spotify":"com.spotify.music","netflix":"com.netflix.mediaclient",
 "tiktok":"com.zhiliaoapp.musically","discord":"com.discord","drive":"com.google.android.apps.docs",
 "fotos":"com.google.android.apps.photos","play store":"com.android.vending",
 "agenda":"com.google.android.calendar","relogio":"com.google.android.deskclock",
 "calculadora":"com.google.android.calculator","configuracoes":"com.android.settings",
 "telefone":"com.google.android.dialer","mensagens":"com.google.android.apps.messaging",
 "prime video":"com.amazon.avod.thirdpartyclient","acode":"com.foxdebug.acode"
};
let customApps=store.get("apps",{});
function findApp(n){
 const all={...APPS,...customApps};if(all[n])return[n,all[n]];
 for(const k of Object.keys(all).sort((a,b)=>b.length-a.length))if(k.length>2&&n.includes(k))return[k,all[k]];
 return null;
}
function intentUrl(pkg){return "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package="+pkg+";end"}
function addOpenButton(label,href){
 const b=document.createElement("button");b.className="btn";b.style.cssText="margin:4px;padding:8px";
 b.textContent="Abrir "+label;b.onclick=()=>location.href=href;logEl.appendChild(b);
}
function localCommand(text){
 const t=norm(text).trim();let m;
 m=t.match(/^cadastre\s+(.+?)\s+pacote\s+([a-z0-9_.]+)$/);
 if(m){customApps[m[1]]=m[2];store.set("apps",customApps);return "Cadastrado. "+m[1]+" agora está associado ao pacote informado."}
 m=t.match(/^(?:adicione|adicionar|cadastre|cadastrar)\s+palavra de ativacao\s+(.+)$/);
 if(m){const w=m[1].trim(),a=store.get("wakewords",[]);if(w&&!a.includes(w))a.push(w);store.set("wakewords",a);return "Palavra de ativação adicionada: "+w+"."}
 m=t.match(/^(?:abrir|abra|abre|inicie|iniciar|execute|executar|lance|lancar)\s+(.+)$/);
 if(!m)return null;
 const rest=m[1].replace(/^(o|a|os|as|app|aplicativo)\s+/,"").replace(/[?!.,]+$/,"").trim();
 const site=rest.match(/^(?:site\s+)?([a-z0-9-]+(?:\.[a-z0-9-]+)+(?:\/\S*)?)$/);
 if(site){const u="https://"+site[1];addOpenButton(site[1],u);setTimeout(()=>location.href=u,700);return "Abrindo "+site[1]+"."}
 const f=findApp(rest);
 if(!f)return "Não encontrei o aplicativo "+rest+". Você pode cadastrá-lo usando: cadastre "+rest+" pacote nome.do.pacote";
 const href=intentUrl(f[1]);addOpenButton(f[0],href);setTimeout(()=>location.href=href,700);
 return "Abrindo "+f[0]+".";
}

/* IA: chamada direta, menos tokens e timeout menor */
async function askAI(userText){
 lastSources=[];
 const local=localCommand(userText);
 if(local!==null)return local;

 const city=userText.match(/\b(?:minha cidade é|defina minha cidade como|moro em)\s+(.+)/i);
 if(city){
  const g=await geocode(city[1].replace(/[?!.]+$/,"").trim());store.set("place",g);
  return "Certo. Sua cidade foi definida como "+g.name+".";
 }

 /* Respostas locais não precisam gastar uma chamada da IA */
 const asksWeather=RE.weather.test(userText);
 const asksMoney=RE.money.test(userText);
 const asksTime=RE.time.test(userText);
 const onlyLocal=/^(?:por favor[, ]*)?(?:como está|como esta|qual é|qual e|me diga|consulte|verifique|veja)?\s*(?:o clima|o tempo|a previsão|a previsao|a temperatura|a cotação do dólar|a cotacao do dolar|o dólar|o dolar|o euro|o bitcoin|que horas são|que horas sao|que dia é hoje|que dia e hoje|qual a data)(?:\s+.*)?[?.!]*$/i.test(norm(userText));
 if(onlyLocal){
  setMode("thinking","CONSULTANDO DADOS");
  try{
   if(asksWeather)return await toolWeather(userText);
   if(asksMoney)return await toolMoney();
   if(asksTime)return await toolTime(userText);
  }catch(e){return "Não consegui consultar os dados agora. Verifique a conexão e tente novamente."}
 }

 setMode("thinking","PROCESSANDO");
 const t0=performance.now();
 let live="";
 /* Não atrase perguntas comuns com pesquisas. Só pesquise quando necessário. */
 if(NEWS_RE.test(userText)||/\b(pesquise na internet|pesquise na web|procure na internet|busque na internet)\b/i.test(userText)){
  setMode("thinking","CONSULTANDO INTERNET");
  live=await getLiveContext(userText);
 }
 const now=new Date().toLocaleString("pt-BR",{dateStyle:"full",timeStyle:"short"});
 let content=userText;
 if(live)content="Pergunta: "+userText+"\nDados auxiliares atuais:\n"+live+"\nResponda de forma direta, sem inventar informações.";
 const messages=[
  {role:"system",content:SYSTEM_PROMPT+" Agora: "+now+". Fuso: "+TZ+"."},
  ...history.slice(-6),
  {role:"user",content:content}
 ];
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);
 try{
  const res=await fetch(WORKER_URL,{
   method:"POST",headers:{"Content-Type":"application/json"},
   signal:controller.signal,
   body:JSON.stringify({
    model:MODEL,messages,temperature:.3,max_tokens:350,stream:false
   })
  });
  const raw=await res.text();let data;
  try{data=JSON.parse(raw)}catch(e){throw new Error("Resposta inválida do Worker (HTTP "+res.status+").")}
  if(!res.ok)throw new Error("Worker HTTP "+res.status+": "+String(data?.error?.message||data?.error||data?.message||"falha na API").slice(0,160));
  const answer=data?.choices?.[0]?.message?.content;
  if(typeof answer!=="string"||!answer.trim())throw new Error("A IA retornou uma resposta vazia.");
  $("lat").textContent=Math.round(performance.now()-t0);$("led").classList.remove("off");
  const final=answer.trim();
  history.push({role:"user",content:userText},{role:"assistant",content:final});
  history=history.slice(-12);store.set("history",history);
  return final;
 }catch(e){
  if(e.name==="AbortError")throw new Error("A IA demorou mais de 30 segundos. Tente novamente.");
  throw e;
 }finally{clearTimeout(timer)}
}

async function handleInput(raw){
 const text=String(raw||"").trim();if(!text||busy)return;
 busy=true;sendBtn.disabled=micBtn.disabled=true;
 addMsg("SENHOR",text,"user");
 setMode("thinking","PROCESSANDO");
 const started=performance.now();
 try{
  const reply=await askAI(text);lastReply=reply;
  addMsg("JARVIS",reply);
  $("lat").textContent=Math.round(performance.now()-started);
  speak(reply);
 }catch(err){
  $("led").classList.add("off");
  addMsg("SISTEMA","Falha: "+(err.message||"não foi possível responder")+". Verifique a conexão ou toque em Diagnóstico.","sys");
  setMode("idle","FALHA NA CONEXÃO");
 }finally{
  busy=false;sendBtn.disabled=micBtn.disabled=false;
 }
}

/* MICROFONE */
async function ensureMic(){
 try{
  if(navigator.mediaDevices?.getUserMedia){
   const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());
  }return true;
 }catch(e){addMsg("SISTEMA","Permita o uso do microfone nas configurações do navegador.","sys");return false}
}
function startListening(){
 if(busy)return;
 if(wake){awaitCmd=true;awaitUntil=Date.now()+7000;stateEl.textContent="OUVINDO COMANDO";beep();return}
 if(!SR){addMsg("SISTEMA","Reconhecimento de voz indisponível. Abra esta página no Chrome.","sys");return}
 try{recognition?.abort()}catch(e){}
 if("speechSynthesis"in window)speechSynthesis.cancel();
 recognition=new SR();recognition.lang="pt-BR";recognition.interimResults=false;recognition.maxAlternatives=1;
 let heard=false;
 recognition.onstart=()=>setMode("listening");
 recognition.onresult=e=>{heard=true;handleInput(e.results[0][0].transcript)};
 recognition.onerror=e=>{
  if(e.error==="not-allowed"||e.error==="service-not-allowed")addMsg("SISTEMA","Acesso ao microfone bloqueado.","sys");
  else if(e.error==="network")addMsg("SISTEMA","Falha de rede no reconhecimento de voz.","sys");
 };
 recognition.onend=()=>{if(mode==="listening"&&!heard)setMode("idle")};
 try{recognition.start()}catch(e){setMode("idle")}
}

/* ATIVAÇÃO POR NOME */
const WAKE_RX=/\b(?:jarvis|jarves|jarvi|jarvis|javis|jervis|garvis|djarvis|charvis|xarvis|yarvis|jarbas|jarbis|jar vis|ja vis|charles|charley|charlie)\b/i;
function findWake(raw){
 const n=norm(raw);let best=null;const m=WAKE_RX.exec(n);
 if(m)best={i:m.index,l:m[0].length};
 for(const w of store.get("wakewords",[])){
  const k=norm(w).trim(),i=n.indexOf(k);
  if(k&&i>=0&&(!best||i<best.i))best={i,l:k.length};
 }
 return best;
}
async function keepScreen(on){
 try{
  if(on&&navigator.wakeLock&&!wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>wakeLock=null)}
  else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}
 }catch(e){}
}
function onWakeResult(e){
 for(let i=e.resultIndex;i<e.results.length;i++){
  const r=e.results[i];if(!r.isFinal)continue;
  let hit=null;
  for(let a=0;a<r.length;a++){const tx=r[a].transcript,f=findWake(tx);if(f){hit={tx,f};break}}
  if(mode==="speaking"){
   if(hit&&/\b(para|pare|silencio|stop)\b/i.test(norm(hit.tx.slice(hit.f.i+hit.f.l))) )stopSpeaking();
   continue;
  }
  if(mode!=="idle"||busy||Date.now()<ignoreUntil)continue;
  if(hit){
   const cmd=hit.tx.slice(hit.f.i+hit.f.l).replace(/^[\s,.!?:;-]+/,"").trim();
   if(cmd.length>2)handleInput(cmd);
   else{awaitCmd=true;awaitUntil=Date.now()+7000;stateEl.textContent="OUVINDO COMANDO";beep()}
  }else if(awaitCmd&&Date.now()<awaitUntil){
   awaitCmd=false;handleInput(r[0].transcript);
  }
 }
}
function startWake(){
 if(!SR||!wake)return;
 try{wakeRec?.abort()}catch(e){}
 const r=new SR();wakeRec=r;r.lang="pt-BR";r.continuous=false;r.interimResults=false;r.maxAlternatives=3;
 r.onstart=()=>{if(mode==="idle"&&!awaitCmd)stateEl.textContent='AGUARDANDO "JARVIS"'};
 r.onresult=onWakeResult;
 r.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){wake=false;store.set("wake",false);syncWake();addMsg("SISTEMA","Microfone bloqueado.","sys")}};
 r.onend=()=>{if(wakeRec===r&&wake)setTimeout(startWake,250)};
 try{r.start()}catch(e){setTimeout(startWake,1000)}
}
function syncWake(){
 $("wake").textContent='Ativação "Jarvis": '+(wake?"on":"off");$("wake").classList.toggle("on",wake);
}
function syncConv(){
 $("conv").textContent="Conversa contínua: "+(continuous?"on":"off");$("conv").classList.toggle("on",continuous);
}
syncWake();syncConv();

$("wake").onclick=async()=>{
 if(!SR){addMsg("SISTEMA","Abra esta página no Chrome para usar ativação por voz.","sys");return}
 if(!wake){
  if(!(await ensureMic()))return;
  wake=true;store.set("wake",true);continuous=false;store.set("continuous",false);syncWake();syncConv();
  await keepScreen(true);startWake();setMode("idle");beep();
 }else{
  wake=false;store.set("wake",false);syncWake();await keepScreen(false);
  try{wakeRec?.abort()}catch(e){}setMode("idle");
 }
};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&wake){keepScreen(true);startWake()}});
$("conv").onclick=()=>{continuous=!continuous;store.set("continuous",continuous);syncConv();if(continuous&&mode==="idle")startListening()};
$("mic").onclick=()=>{if(mode==="listening"){try{recognition?.abort()}catch(e){}setMode("idle")}else startListening()};
$("send").onclick=()=>{const v=textEl.value;textEl.value="";handleInput(v)};
textEl.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendBtn.click()}});
document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>handleInput(b.dataset.q));
$("rate").value=rate;$("rate").oninput=e=>{rate=+e.target.value;store.set("rate",rate)};
$("repeat").onclick=()=>{if(lastReply)speak(lastReply)};
$("stop").onclick=stopSpeaking;
$("clear").onclick=()=>{history=[];store.set("history",[]);renderHistory()};

/* DIAGNÓSTICO RÁPIDO */
async function diagnose(){
 addMsg("DIAGNÓSTICO","Testando a conexão com o Worker...","sys");
 const t=performance.now();
 try{
  const r=await withTimeout(fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({model:MODEL,messages:[{role:"user",content:"Responda apenas: OK"}],temperature:0,max_tokens:8,stream:false})}),15000);
  const raw=await r.text();let d;try{d=JSON.parse(raw)}catch(e){throw new Error("Resposta não JSON, HTTP "+r.status)}
  if(!r.ok)throw new Error("HTTP "+r.status+" "+String(d.error?.message||d.error||""));
  if(!d.choices?.[0]?.message?.content)throw new Error("Worker respondeu, mas não veio texto da IA");
  addMsg("DIAGNÓSTICO","Worker conectado. Tempo de resposta: "+Math.round(performance.now()-t)+" ms. Reconhecimento de voz: "+(SR?"disponível":"indisponível")+". Voz do navegador: "+("speechSynthesis"in window?"disponível":"indisponível")+".");
 }catch(e){addMsg("DIAGNÓSTICO","Falha: "+(e.message||"erro de conexão"),"sys")}
}
$("diag").onclick=diagnose;
renderHistory();
if(!SR)addMsg("SISTEMA","O navegador atual não reconhece voz. Digitar continua funcionando; abra no Chrome para testar o microfone.","sys");
if(wake&&SR)setTimeout(()=>{keepScreen(true);startWake()},900);

/* ANIMAÇÃO FUTURISTA */
const wave=$("wave"),bars=[];
for(let i=0;i<41;i++){const b=document.createElement("i");wave.appendChild(b);bars.push(b)}
const cv=$("bg"),cx=cv.getContext("2d");let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();
const N=innerWidth<500?300:480,pts=[];
for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*2.399963;pts.push([Math.cos(a)*r,y,Math.sin(a)*r])}
const COLORS={idle:[92,242,255],listening:[77,255,191],thinking:[138,107,255],speaking:[120,225,255]};
let col=[92,242,255],amp=0,spin=0,t=0;
function frame(){
 t+=.016;const target=COLORS[mode]||COLORS.idle;
 for(let i=0;i<3;i++)col[i]+=(target[i]-col[i])*.06;
 const goal=mode==="speaking"?.55+.45*Math.abs(Math.sin(t*9)*Math.sin(t*3.7)):mode==="listening"?.4:mode==="thinking"?.3:.08+.04*Math.sin(t*1.5);
 amp+=(goal-amp)*.12;spin+=mode==="thinking"?.03:mode==="idle"?.004:.012;
 const px=W/2,py=H*.34,R=Math.min(W,H)*(W<500?.19:.21);cx.clearRect(0,0,W,H);
 const c=col.map(v=>v|0).join(",");
 const g=cx.createRadialGradient(px,py,R*.2,px,py,R*2.5);g.addColorStop(0,`rgba(${c},${.14+amp*.16})`);g.addColorStop(1,`rgba(${c},0)`);
 cx.fillStyle=g;cx.fillRect(0,0,W,H);
 [[1.55,0,.5,[6,10]],[1.8,Math.PI/3,-.3,[2,14]],[2.1,0,.18,[60,18]]].forEach(([k,off,sp,dash],i)=>{
  cx.save();cx.translate(px,py);cx.rotate(off+t*sp);cx.strokeStyle=`rgba(${c},${.28-i*.06})`;cx.lineWidth=1;cx.setLineDash(dash);cx.beginPath();cx.arc(0,0,R*k,0,Math.PI*2);cx.stroke();cx.restore()
 });
 cx.setLineDash([]);cx.strokeStyle=`rgba(${c},.9)`;cx.lineWidth=2;cx.beginPath();cx.arc(px,py,R*1.35,t*1.4,t*1.4+.6+amp*1.4);cx.stroke();
 const cs=Math.cos(spin),sn=Math.sin(spin),ct=Math.cos(.35),st=Math.sin(.35),rad=R*(1+amp*.16);
 for(let i=0;i<N;i++){
  let[x,y,z]=pts[i];const wob=1+amp*.22*Math.sin(t*5+i*.37);x*=wob;y*=wob;z*=wob;
  const x1=x*cs+z*sn,z1=-x*sn+z*cs,y1=y*ct-z1*st,z2=y*st+z1*ct,p=1/(1.9-z2*.55);
  const sx=px+x1*rad*p*1.5,sy=py+y1*rad*p*1.5,a=.18+.82*((z2+1)/2),s=(.6+1.5*((z2+1)/2))*(1+amp*.5);
  cx.fillStyle=`rgba(${c},${a.toFixed(2)})`;cx.fillRect(sx-s/2,sy-s/2,s,s)
 }
 const cg=cx.createRadialGradient(px,py,0,px,py,R*.5);cg.addColorStop(0,`rgba(255,255,255,${.5+amp*.4})`);cg.addColorStop(.35,`rgba(${c},${.35+amp*.3})`);cg.addColorStop(1,`rgba(${c},0)`);
 cx.fillStyle=cg;cx.beginPath();cx.arc(px,py,R*.5,0,Math.PI*2);cx.fill();
 bars.forEach((b,i)=>{const m=Math.sin(i/bars.length*Math.PI),h=3+(mode==="idle"?1.5:22*amp*m*(.5+.5*Math.abs(Math.sin(t*7+i*.8))));b.style.height=h.toFixed(1)+"px";b.style.background=`rgb(${c})`;b.style.opacity=mode==="idle"?.35:.95});
 requestAnimationFrame(frame)
}
frame();
</script>
