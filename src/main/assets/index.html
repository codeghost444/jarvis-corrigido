<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02060d">
<title>J.A.R.V.I.S.</title>
<style>
:root{--void:#02060d;--ice:#5cf2ff;--plasma:#8a6bff;--amber:#ffb454;--ok:#4dffbf;--line:rgba(92,242,255,.22);--text:#dff6ff;--dim:#7d9fb8;--mono:ui-monospace,monospace;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--void);color:var(--text);font-family:var(--sans);overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 3px,rgba(92,242,255,.02) 3px 4px)}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,transparent 35%,rgba(0,0,0,.75))}
main{position:relative;z-index:2;height:100%;max-width:720px;margin:auto;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.hud{display:flex;justify-content:space-between;align-items:center;font:12px/1.4 var(--mono);color:var(--dim)}
.hud b{color:var(--ice);font-weight:500}
.hud .r{display:flex;gap:10px;align-items:center;text-align:right}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);margin-right:6px}.led.off{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.gear{width:38px;height:38px;border:1px solid var(--line);background:rgba(8,28,50,.7);color:var(--text);border-radius:50%;font-size:17px;cursor:pointer}
.stage{flex:1;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;pointer-events:none;padding-bottom:8px}
.stage h1{font:200 clamp(24px,7vw,34px)/1 var(--sans);letter-spacing:.5em;padding-left:.5em;color:#fff;text-shadow:0 0 28px var(--ice)}
.state{margin-top:8px;font:12px var(--mono);letter-spacing:.18em;color:var(--ice);min-height:16px}
.wave{display:flex;gap:3px;align-items:center;height:20px;margin-top:6px}
.wave i{width:2px;height:3px;background:var(--ice);border-radius:2px;transition:height .08s}
.panel{border:1px solid var(--line);background:linear-gradient(160deg,rgba(6,22,40,.82),rgba(2,8,18,.86));backdrop-filter:blur(10px);border-radius:8px;overflow:hidden}
.log{max-height:min(42vh,380px);min-height:90px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.msg{max-width:92%;font-size:15px;line-height:1.55;overflow-wrap:anywhere;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(10,36,60,.55);align-self:flex-start}
.msg .body{white-space:pre-wrap}
.who{display:block;font:11px var(--mono);color:var(--ice);margin-bottom:2px}
.msg.user{align-self:flex-end;background:rgba(60,40,130,.45);border-color:rgba(138,107,255,.45);color:#e0dcff}.msg.user .who{color:var(--plasma);text-align:right}
.msg.sys{border-color:rgba(255,180,84,.5);background:rgba(70,40,0,.35)}.msg.sys .who{color:var(--amber)}
.src{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.src a{font:11px var(--mono);color:var(--ice);border:1px solid var(--line);border-radius:99px;padding:4px 9px;text-decoration:none;background:rgba(2,9,20,.6)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip,.btn{border:1px solid var(--line);background:rgba(8,28,50,.8);color:var(--text);border-radius:99px;padding:8px 13px;font:13px var(--sans);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn{border-radius:8px}
.chip:active,.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
.dock{display:flex;gap:8px;margin-top:8px;align-items:stretch}
.dock input{flex:1;min-width:0;background:rgba(2,9,20,.9);border:1px solid var(--line);border-radius:26px;color:#fff;padding:0 16px;font:16px var(--sans);outline:none;height:52px}
.dock input:focus,.chip:focus-visible,.btn:focus-visible,.gear:focus-visible{border-color:var(--ice);outline:2px solid rgba(92,242,255,.4)}
.round{width:52px;height:52px;border-radius:50%;border:1px solid var(--ice);background:rgba(8,28,50,.9);color:var(--text);font-size:21px;cursor:pointer;flex:none}
.round:disabled{opacity:.4}
body.listening #mic{background:rgba(10,110,90,.7);border-color:var(--ok);box-shadow:0 0 18px rgba(77,255,191,.5)}
#halt{border-color:var(--amber);color:var(--amber)}
#send{background:var(--ice);color:#001018;border-color:var(--ice)}
.drawer{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:rgba(4,14,28,.92);font-size:13px}
.drawer[hidden]{display:none}
.drawer .btn.on{border-color:var(--ok);color:var(--ok)}
.drawer label{grid-column:1/-1;display:flex;gap:10px;align-items:center;color:var(--dim)}.drawer input[type=range]{flex:1;accent-color:var(--ice)}
@media(max-height:640px){.stage{min-height:90px}.log{max-height:28vh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas><div class="vignette"></div>
<main>
  <div class="hud">
    <div><span class="led" id="led"></span><b id="net">ONLINE</b> · <span id="lat">--</span> ms</div>
    <div class="r"><div><b id="clock">--:--:--</b><br><span id="date"></span></div><button class="gear" id="gear" aria-label="Configurações">⚙</button></div>
  </div>
  <section class="stage">
    <h1>JARVIS</h1><div class="state" id="state">PRONTO</div><div class="wave" id="wave"></div>
  </section>
  <section class="panel"><div class="log" id="log" aria-live="polite"></div></section>
  <div class="chips">
    <button class="chip" data-q="Como está o clima hoje?">☀ Clima</button>
    <button class="chip" data-q="Quais as principais notícias do Brasil hoje?">📰 Brasil</button>
    <button class="chip" data-q="Quais as principais notícias do mundo hoje?">🌍 Mundo</button>
    <button class="chip" data-q="Qual a cotação do dólar hoje?">💵 Dólar</button>
    <button class="chip" data-q="Resultados de futebol de hoje">⚽ Futebol</button>
    <button class="chip" data-q="Últimas notícias de tecnologia">💻 Tecnologia</button>
    <button class="chip" data-q="Que horas são e que dia é hoje?">🕒 Hora</button>
  </div>
  <div class="dock">
    <button class="round" id="mic" aria-label="Falar">🎙</button>
    <input id="text" placeholder="Pergunte qualquer coisa…" autocomplete="off" enterkeyhint="send">
    <button class="round" id="halt" aria-label="Parar" hidden>■</button>
    <button class="round" id="send" aria-label="Enviar">➤</button>
  </div>
  <div class="drawer" id="drawer" hidden>
    <button class="btn" id="wake"></button><button class="btn" id="conv"></button>
    <button class="btn" id="voice"></button><button class="btn" id="repeat">Repetir resposta</button>
    <label>Velocidade da voz <input type="range" id="rate" min="0.8" max="1.4" step="0.05" value="1"></label>
    <button class="btn" id="diag">Diagnóstico</button><button class="btn" id="clear">Limpar conversa</button>
  </div>
</main>
<script>
"use strict";

/* ================= CONFIGURAÇÃO ================= */
const WORKER_URL="https://still-grass-fbf7.bartmeuadriano.workers.dev/";
const MODEL="nvidia/nemotron-3.5-super-vl-120b-a12b";

const $=id=>document.getElementById(id),enc=encodeURIComponent;
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return ""}};
const logEl=$("log"),stateEl=$("state"),micBtn=$("mic"),textEl=$("text"),sendBtn=$("send");
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone;
const store={
 get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

let mode="idle",busy=false,lastReply="",recognition=null,speechToken=0,abortCtl=null;
let continuous=store.get("continuous",false),rate=store.get("rate",1),voiceOn=store.get("voice",true);
let wake=store.get("wake",false),wakeRec=null,awaitCmd=false,awaitUntil=0,ignoreUntil=0,wakeLock=null;
let history=store.get("history",[]).slice(-12);

const SYSTEM_PROMPT=
"Você é JARVIS, assistente pessoal em português brasileiro: inteligente, direto e confiável. "+
"Responda no idioma do usuário. Sua resposta será falada em voz alta: não use Markdown, listas com símbolos, tabelas, asteriscos ou emojis. "+
"Perguntas simples: 1 a 3 frases. Notícias: resuma de 3 a 5 manchetes mais importantes em frases curtas, indicando país ou veículo e a data quando houver. "+
"Quando houver um bloco [WEB], ele contém dados coletados agora da internet: use-os como fonte principal, cite o veículo (por exemplo, segundo a BBC), prefira os mais recentes e avise se as fontes divergirem. "+
"Se o bloco [WEB] não responder, diga isso e complete com seu conhecimento, avisando que pode estar desatualizado. "+
"Nunca invente fatos, números, fontes ou ações. Não repita a pergunta nem faça introduções longas.";

/* ================= UTILIDADES DE INTERFACE ================= */
function greeting(){const h=new Date().getHours();return h<5?"Boa madrugada":h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"}
function tick(){const d=new Date();$("clock").textContent=d.toLocaleTimeString("pt-BR");$("date").textContent=d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"})}
tick();setInterval(tick,1000);
const scrollLog=()=>{logEl.scrollTop=logEl.scrollHeight};
function addMsg(who,text,type){
 const m=document.createElement("div");m.className="msg "+(type||"");
 const w=document.createElement("span");w.className="who";w.textContent=who;
 const b=document.createElement("div");b.className="body";b.textContent=String(text);
 m.append(w,b);logEl.appendChild(m);scrollLog();return{el:m,body:b,text:String(text)};
}
function addSources(el,src){
 const seen=new Set(),box=document.createElement("div");box.className="src";
 src.filter(s=>s.url&&!seen.has(s.url)&&seen.add(s.url)).slice(0,6).forEach(s=>{
  const a=document.createElement("a");a.href=s.url;a.target="_blank";a.rel="noopener";a.title=s.title;
  a.textContent="🔗 "+(host(s.url)==="news.google.com"?s.title.slice(0,32)+"…":host(s.url)||s.title.slice(0,28));box.appendChild(a);
 });
 if(box.children.length){el.appendChild(box);scrollLog()}
}
function setMode(m,label){
 mode=m;document.body.classList.toggle("listening",m==="listening");
 $("halt").hidden=!(m==="thinking"||m==="speaking");
 stateEl.textContent=label||(m==="idle"&&wake?'AGUARDANDO "JARVIS"':({idle:"PRONTO",listening:"OUVINDO",thinking:"PROCESSANDO",speaking:"RESPONDENDO"}[m]||m));
}
function renderHistory(){
 logEl.textContent="";addMsg("JARVIS",greeting()+", senhor. Posso pesquisar na internet e trazer notícias de qualquer lugar do mundo. O que deseja saber?");
 history.forEach(m=>addMsg(m.role==="user"?"VOCÊ":"JARVIS",m.content,m.role==="user"?"user":""));
}
function showErr(m){addMsg("ERRO",m,"sys")}
window.addEventListener("error",e=>showErr((e.message||"Erro")+", linha "+(e.lineno||"?")));
window.addEventListener("unhandledrejection",e=>{const r=e.reason;if(r===0||r===undefined)return;showErr(String(r?.message||r))});

/* ================= VOZ (fala em frases, enquanto a IA ainda escreve) ================= */
function cleanForSpeech(t){
 return String(t).replace(/J\.?\s*A\.?\s*R\.?\s*V\.?\s*I\.?\s*S\.?/gi,"Jarvis")
 .replace(/https?:\/\/\S+/gi,"link").replace(/```[\s\S]*?```/g,"")
 .replace(/\[([^\]]+)\]\([^)]+\)/g,"$1").replace(/[*_~`#>]/g,"")
 .replace(/^\s*[-•]\s+/gm,"").replace(/\s+/g," ").trim();
}
function ptVoice(){
 if(!("speechSynthesis" in window))return null;
 const v=speechSynthesis.getVoices();
 return v.find(x=>/pt-BR/i.test(x.lang)&&/Google|Natural|Online/i.test(x.name))||v.find(x=>/pt-BR/i.test(x.lang))||v.find(x=>/^pt/i.test(x.lang))||null;
}
let sq={on:false,n:0,done:true,buf:"",tok:0};
function sayStart(){
 speechToken++;if("speechSynthesis" in window)speechSynthesis.cancel();
 sq={on:"speechSynthesis" in window,n:0,done:false,buf:"",tok:speechToken};
}
function sayChunk(s){
 const clean=cleanForSpeech(s);if(!clean)return;
 const tok=sq.tok,u=new SpeechSynthesisUtterance(clean);
 u.lang="pt-BR";u.rate=rate;u.pitch=.96;const v=ptVoice();if(v)u.voice=v;
 sq.n++;
 u.onstart=()=>{if(tok===speechToken)setMode("speaking")};
 const end=()=>{if(tok!==speechToken)return;sq.n--;if(sq.done&&sq.n<=0){sq.on=false;finishSpeaking()}};
 u.onend=end;u.onerror=end;speechSynthesis.speak(u);
}
function sayFeed(t,final){
 if(!sq.on){if(final)finishSpeaking();return}
 sq.buf+=t;let m;
 while((m=sq.buf.match(/^([\s\S]*?[.!?:;]+)\s+/))){sayChunk(m[1]);sq.buf=sq.buf.slice(m[0].length)}
 if(final){if(sq.buf.trim())sayChunk(sq.buf);sq.buf="";sq.done=true;if(sq.n<=0){sq.on=false;finishSpeaking()}}
}
function finishSpeaking(){
 ignoreUntil=Date.now()+800;setMode("idle");
 if(continuous&&!busy&&!wake)setTimeout(startListening,250);
}
function stopAll(){
 speechToken++;sq.on=false;try{abortCtl?.abort()}catch(e){}
 if("speechSynthesis" in window)speechSynthesis.cancel();
 ignoreUntil=Date.now()+500;setMode("idle","PARADO");
}
let actx=null;
function beep(){
 try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();
 const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.07;
 o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.1)}catch(e){}
}

/* ================= REDE E BUSCA NA WEB ================= */
async function fetchTimed(url,ms=5000){
 const c=new AbortController(),timer=setTimeout(()=>c.abort(),ms);
 try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error("HTTP "+r.status);return r}
 finally{clearTimeout(timer)}
}
const getJSON=async(u,ms)=>(await fetchTimed(u,ms)).json();
const getText=async(u,ms)=>(await fetchTimed(u,ms)).text();
/* Proxies públicos (CORS) consultados em paralelo: vence o mais rápido */
const PROXIES=[u=>"https://api.allorigins.win/raw?url="+enc(u),u=>"https://corsproxy.io/?"+enc(u)];
const viaProxy=(u,ms=6500)=>Promise.any(PROXIES.map(p=>getText(p(u),ms)));
const cache=new Map();
async function cached(k,fn,ttl=300000){
 const c=cache.get(k);if(c&&Date.now()-c.t<ttl)return c.v;
 const v=await fn();cache.set(k,{t:Date.now(),v});return v;
}
const core=t=>String(t).replace(/[?!.]+$/,"")
 .replace(/^(por favor[, ]*)?(pesquise|pesquisar|procure|busque)\s*(na\s+(internet|web))?\s*(sobre|por)?\s*/i,"")
 .replace(/^(quem\s+(é|foi|são)|o\s+que\s+(é|são|foi)|me\s+(diga|fale|conte)\s*(sobre)?)\s*/i,"").trim();

/* 1. Busca geral (DuckDuckGo) */
async function sDDG(q){
 const html=await cached("d:"+q,()=>viaProxy("https://html.duckduckgo.com/html/?kl=br-pt&q="+enc(q)));
 const doc=new DOMParser().parseFromString(html,"text/html");
 const r=[...doc.querySelectorAll(".result:not(.result--ad)")].map(e=>{
  const a=e.querySelector(".result__a");if(!a)return null;
  let h=a.getAttribute("href")||"";const m=h.match(/uddg=([^&]+)/);if(m)h=decodeURIComponent(m[1]);
  return{title:a.textContent.trim(),url:h,snip:(e.querySelector(".result__snippet")?.textContent||"").trim()};
 }).filter(Boolean).slice(0,6);
 if(!r.length)throw 0;
 return{text:"Resultados de busca na web:\n"+r.map((x,i)=>(i+1)+". "+x.title+" — "+x.snip+" ("+host(x.url)+")").join("\n"),src:r,top:r[0].url};
}
/* 2. Wikipédia (pt, depois en) */
async function sWiki(q){
 for(const lang of["pt","en"]){
  const d=await getJSON("https://"+lang+".wikipedia.org/w/api.php?action=query&generator=search&gsrlimit=1&gsrsearch="+enc(q)+"&prop=extracts&exintro=1&explaintext=1&exsentences=4&format=json&origin=*",4500).catch(()=>null);
  const p=Object.values(d?.query?.pages||{})[0];
  if(p?.extract)return{text:"Wikipédia — "+p.title+": "+p.extract,src:[{title:"Wikipédia: "+p.title,url:"https://"+lang+".wikipedia.org/wiki/"+enc(p.title.replace(/ /g,"_"))}]};
 }
 throw 0;
}
/* 3. Ler o conteúdo de uma página */
async function sPage(u){
 const d=new DOMParser().parseFromString(await viaProxy(u,7500),"text/html");
 d.querySelectorAll("script,style,nav,footer,header,aside,form").forEach(e=>e.remove());
 const t=[...d.querySelectorAll("h1,h2,p,li")].map(e=>e.textContent.trim()).filter(x=>x.length>40).join(" ").slice(0,3000);
 if(!t)throw 0;
 return{text:"Conteúdo da página "+host(u)+": "+t,src:[{title:d.title||host(u),url:u}]};
}
/* 4. Notícias de qualquer país (Google Notícias por edição) + GDELT global */
const CC=Object.fromEntries(("brasil BR pt-419|portugal PT pt-150|angola AO pt-150|mocambique MZ pt-150|eua US en|estados unidos US en|reino unido GB en|inglaterra GB en|canada CA en|australia AU en|india IN en|africa do sul ZA en|nigeria NG en|filipinas PH en|paquistao PK en|argentina AR es-419|mexico MX es-419|chile CL es-419|colombia CO es-419|peru PE es-419|venezuela VE es-419|uruguai UY es-419|paraguai PY es-419|bolivia BO es-419|equador EC es-419|cuba CU es-419|espanha ES es|franca FR fr|alemanha DE de|italia IT it|holanda NL nl|grecia GR el|russia RU ru|ucrania UA uk|turquia TR tr|japao JP ja|coreia do sul KR ko|china CN zh-CN|tailandia TH th|indonesia ID id|vietna VN vi|egito EG ar|arabia saudita SA ar|israel IL en").split("|")
 .map(s=>{const a=s.split(" "),l=a.pop(),c=a.pop();return[a.join(" "),[c,l]]}));
const CKEYS=Object.keys(CC).sort((a,b)=>b.length-a.length);
const STOP=/\b(quais|qual|sao|as|os|principais|ultimas?|noticias?|manchetes?|de|do|da|dos|das|em|no|na|hoje|agora|me|diga|conte|sobre|o|a|que|esta|estao|acontecendo|aconteceu|pelo|mundo|todo|pais|noticia)\b/g;
const fmtDate=d=>{const x=new Date(d);return isNaN(x)?"":x.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})};
async function sNews(text){
 const n=norm(text);let cc=null,name="";
 for(const k of CKEYS)if(new RegExp("\\b"+k+"\\b").test(n)){cc=CC[k];name=k;break}
 const topic=(name?n.replace(new RegExp("\\b"+name+"\\b","g")," "):n).replace(STOP," ").replace(/[^\p{L}\p{N} ]/gu," ").replace(/\s+/g," ").trim();
 const[gl,lang]=cc||["BR","pt-419"],ed="hl="+lang+"&gl="+gl+"&ceid="+gl+":"+lang;
 const rss=topic?"https://news.google.com/rss/search?q="+enc(topic+" when:7d")+"&"+ed
  :cc?"https://news.google.com/rss?"+ed:"https://news.google.com/rss/headlines/section/topic/WORLD?"+ed;
 let items=[];
 try{const d=await cached("n:"+rss,()=>getJSON("https://api.rss2json.com/v1/api.json?rss_url="+enc(rss),7000),180000);items=(d.items||[]).map(i=>({title:i.title,url:i.link,date:i.pubDate}))}catch(e){}
 if(!items.length){
  const x=new DOMParser().parseFromString(await viaProxy(rss,7000),"text/xml");
  items=[...x.querySelectorAll("item")].map(i=>({title:i.querySelector("title")?.textContent,url:i.querySelector("link")?.textContent,date:i.querySelector("pubDate")?.textContent}));
 }
 items=items.filter(i=>i.title).slice(0,8);if(!items.length)throw 0;
 return{text:"Notícias — "+(name||"mundo")+(topic?", tema: "+topic:"")+":\n"+items.map(i=>"- "+i.title+(i.date?" ["+fmtDate(i.date)+"]":"")).join("\n"),src:items};
}
async function sGdelt(text){
 const q=norm(text).replace(STOP," ").replace(/\s+/g," ").trim();if(q.length<3)throw 0;
 const d=await getJSON("https://api.gdeltproject.org/api/v2/doc/doc?mode=artlist&format=json&maxrecords=6&sort=datedesc&query="+enc(q),6500);
 const a=(d.articles||[]).slice(0,6);if(!a.length)throw 0;
 return{text:"Notícias globais (GDELT):\n"+a.map(x=>"- "+x.title+" ("+x.domain+(x.sourcecountry?", "+x.sourcecountry:"")+")").join("\n"),src:a};
}

/* ================= FERRAMENTAS LOCAIS: CLIMA, DÓLAR, HORA ================= */
const WCODE={0:"céu limpo",1:"quase limpo",2:"parcialmente nublado",3:"nublado",45:"neblina",48:"neblina",51:"garoa fraca",53:"garoa",55:"garoa forte",61:"chuva fraca",63:"chuva",65:"chuva forte",71:"neve fraca",73:"neve",75:"neve forte",80:"pancadas fracas",81:"pancadas de chuva",82:"pancadas fortes",95:"trovoadas",96:"trovoadas com granizo",99:"trovoadas fortes com granizo"};
async function geocode(name){
 const d=await getJSON("https://geocoding-api.open-meteo.com/v1/search?count=1&language=pt&name="+enc(name),5000);
 const r=d.results&&d.results[0];if(!r)throw new Error("Cidade não encontrada: "+name);
 return{lat:r.latitude,lon:r.longitude,name:r.name+(r.admin1?", "+r.admin1:""),tz:r.timezone};
}
function myPlace(){
 const saved=store.get("place",null);
 return new Promise(res=>{
  if(!navigator.geolocation)return res(saved);
  navigator.geolocation.getCurrentPosition(p=>{const o={lat:p.coords.latitude,lon:p.coords.longitude,name:"sua localização",tz:TZ};store.set("place",o);res(o)},()=>res(saved),{timeout:2500,maximumAge:3600000});
 });
}
function cityFrom(text){
 const m=String(text).match(/\b(?:em|para|na|no|de|do|da)\s+([^?!.,]+?)\s*(?:[?!.,]|$)/i);if(!m)return"";
 const c=m[1].replace(/\b(hoje|amanh[aã]|agora|depois|esta|essa|nesta|neste|semana|tarde|noite|manh[aã])\b.*$/i,"").trim();
 return/^(hoje|amanh|agora|semana|casa|mim|voc[eê])/i.test(c)?"":c;
}
const RE={
 time:/\b(que horas|horas s[aã]o|hora (?:agora|atual|certa)|que dia|data de hoje|qual a data|dia da semana)\b/i,
 weather:/\b(clima|tempo (?:hoje|amanh|agora|est[aá]|vai|em|para)|previs[aã]o do tempo|temperatura|chover|chuva|vai chover|umidade)\b/i,
 money:/\b(d[oó]lar|euro|bitcoin|cota[cç][aã]o|c[aâ]mbio)\b/i
};
async function toolWeather(text){
 const c=cityFrom(text),place=c?await geocode(c):await myPlace();
 if(!place)throw new Error("Diga sua cidade: 'minha cidade é ...'");
 const d=await getJSON("https://api.open-meteo.com/v1/forecast?latitude="+place.lat+"&longitude="+place.lon+"&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=2",6500);
 const x=d.current,q=d.daily,r=i=>Math.round(q.temperature_2m_min[i])+" a "+Math.round(q.temperature_2m_max[i]);
 return"Em "+place.name+", agora faz "+Math.round(x.temperature_2m)+" graus, sensação de "+Math.round(x.apparent_temperature)+", "+(WCODE[x.weather_code]||"condição não identificada")+", umidade de "+x.relative_humidity_2m+" por cento e vento de "+Math.round(x.wind_speed_10m)+" quilômetros por hora. Hoje: de "+r(0)+" graus, chance de chuva de "+(q.precipitation_probability_max[0]??"?")+" por cento. Amanhã: de "+r(1)+" graus, chuva "+(q.precipitation_probability_max[1]??"?")+" por cento, "+(WCODE[q.weather_code[1]]||"")+".";
}
async function toolMoney(){
 const d=await getJSON("https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL",5000),f=v=>Number(v.bid).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
 return"Cotação atual. Dólar: "+f(d.USDBRL)+". Euro: "+f(d.EURBRL)+". Bitcoin: "+f(d.BTCBRL)+". Os valores variam durante o dia.";
}
async function toolTime(text){
 const c=cityFrom(text);let tz=TZ,nome="sua região";
 if(c){const g=await geocode(c);tz=g.tz;nome=g.name}
 const d=new Date();
 return"Em "+nome+", agora são "+d.toLocaleTimeString("pt-BR",{timeZone:tz,hour:"2-digit",minute:"2-digit"})+". Hoje é "+d.toLocaleDateString("pt-BR",{timeZone:tz,weekday:"long",day:"numeric",month:"long",year:"numeric"})+".";
}

/* ================= DECISÃO: PRECISA PESQUISAR? ================= */
const NEWS_RE=/\b(not[ií]cias?|manchetes?|aconteceu|acontecendo|[uú]ltimas)\b/i;
const SMALL_RE=/^(oi|ol[aá]|obrigad[oa]|valeu|tudo bem|bom dia|boa tarde|boa noite|ok|certo|sim|n[aã]o|tchau|at[eé] mais)\b/i;
const NOWEB_RE=/^(escreva|redija|traduza|resuma|corrija|calcule|quanto [eé] [\d(]|conte uma|me conte uma piada|crie um|explique (o c[oó]digo|esse c[oó]digo))/i;
function needWeb(t){
 const s=t.trim();
 return s.length>3&&!SMALL_RE.test(norm(s))&&!NOWEB_RE.test(norm(s))&&!/^[\d\s+\-*/().,x]+$/.test(s);
}
async function gather(text){
 const tasks=[],n=norm(text),q=core(text),urls=text.match(/https?:\/\/\S+/g);
 const explicit=/\b(pesquise|pesquisar|procure|busque|a fundo|detalhad)/i.test(text);
 if(urls)tasks.push(sPage(urls[0]));
 else if(NEWS_RE.test(text))tasks.push(sNews(text),sGdelt(text));
 else{
  tasks.push(sDDG(q));
  if(/\b(quem|o que|significa|historia|biografia|conceito|definicao)\b/.test(n)||q.split(/\s+/).length<4)tasks.push(sWiki(q));
 }
 if(!urls){
  if(RE.weather.test(text))tasks.push(toolWeather(text).then(t=>({text:"Clima: "+t,src:[]})));
  if(RE.money.test(text))tasks.push(toolMoney().then(t=>({text:t,src:[]})));
 }
 const out=[];
 await Promise.race([Promise.allSettled(tasks.map(t=>t.then(r=>out.push(r)))),sleep(6500)]);
 const dd=out.find(r=>r.top);
 if(explicit&&dd){try{out.push(await Promise.race([sPage(dd.top),sleep(5000).then(()=>{throw 0})]))}catch(e){}}
 return{ctx:out.map(r=>r.text).join("\n\n").slice(0,5500),src:out.flatMap(r=>r.src||[])};
}

let customApps=store.get("apps",{});
function findApp(n){
 const all={...APPS,...customApps};if(all[n])return[n,all[n]];
 for(const k of Object.keys(all).sort((a,b)=>b.length-a.length))if(k.length>2&&n.includes(k))return[k,all[k]];

const intentUrl=pkg=>"intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package="+pkg+";end";

function localCommand(text){
 const t=norm(text).trim();let m;
 m=t.match(/^cadastre\s+(.+?)\s+pacote\s+([a-z0-9_.]+)$/);
 if(m){customApps[m[1]]=m[2];store.set("apps",customApps);return"Cadastrado. "+m[1]+" agora está associado ao pacote informado."}
 m=t.match(/^(?:adicione|adicionar|cadastre|cadastrar)\s+palavra de ativacao\s+(.+)$/);
 if(m){const w=m[1].trim(),a=store.get("wakewords",[]);if(w&&!a.includes(w))a.push(w);store.set("wakewords",a);return"Palavra de ativação adicionada: "+w+"."}
 m=t.match(/^(?:abrir|abra|abre|inicie|iniciar|execute|executar|lance|lancar)\s+(.+)$/);
 if(!m)return null;
 const rest=m[1].replace(/^(o|a|os|as|app|aplicativo)\s+/,"").replace(/[?!.,]+$/,"").trim();
 const site=rest.match(/^(?:site\s+)?([a-z0-9-]+(?:\.[a-z0-9-]+)+(?:\/\S*)?)$/);
 if(site){const u="https://"+site[1];addOpenButton(site[1],u);setTimeout(()=>location.href=u,700);return"Abrindo "+site[1]+"."}
 const f=findApp(rest);
 if(!f)return"Não encontrei o aplicativo "+rest+". Cadastre usando: cadastre "+rest+" pacote nome.do.pacote";
 const href=intentUrl(f[1]);addOpenButton(f[0],href);setTimeout(()=>location.href=href,700);
 return"Abrindo "+f[0]+".";
}

/* ================= IA: STREAMING (resposta aparece e é falada enquanto chega) ================= */
async function streamAI(messages,onDelta,ctl){
 const tm=setTimeout(()=>{ctl.timedOut=true;ctl.abort()},45000);
 try{
  const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,
   body:JSON.stringify({model:MODEL,messages,temperature:.3,max_tokens:600,stream:true})});
  const ct=res.headers.get("content-type")||"";
  if(!res.ok){const raw=await res.text();let d={};try{d=JSON.parse(raw)}catch(e){}
   throw new Error("Worker HTTP "+res.status+": "+String(d?.error?.message||d?.error||d?.message||raw||"falha").slice(0,160))}
  if(!ct.includes("event-stream")||!res.body){
   const d=await res.json(),a=d?.choices?.[0]?.message?.content;
   if(typeof a!=="string"||!a.trim())throw new Error("A IA retornou uma resposta vazia.");
   onDelta(a.trim());return a.trim();
  }
  const rd=res.body.getReader(),dec=new TextDecoder();let buf="",full="";
  for(;;){
   const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
   while((i=buf.indexOf("\n"))>=0){
    const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
    if(!line.startsWith("data:"))continue;const d=line.slice(5).trim();if(d==="[DONE]")continue;
    try{const t=JSON.parse(d).choices?.[0]?.delta?.content;if(t){full+=t;onDelta(t)}}catch(e){}
   }
  }
  if(!full.trim())throw new Error("A IA retornou uma resposta vazia.");
  return full.trim();
 }catch(e){
  if(e.name==="AbortError")throw new Error(ctl.timedOut?"A IA demorou demais. Tente novamente.":"STOP");
  throw e;
 }finally{clearTimeout(tm)}
}

async function askAI(text,cb,ctl){
 const local=localCommand(text);if(local!==null){cb(local);return{text:local,src:[]}}
 const city=text.match(/\b(?:minha cidade é|defina minha cidade como|moro em)\s+(.+)/i);
 if(city){const g=await geocode(city[1].replace(/[?!.]+$/,"").trim());store.set("place",g);const r="Certo. Sua cidade foi definida como "+g.name+".";cb(r);return{text:r,src:[]}}

 /* Caminho rápido: clima, dólar ou hora sem passar pela IA */
 const hits=["weather","money","time"].filter(k=>RE[k].test(text));
 if(hits.length===1&&text.length<80&&!NEWS_RE.test(text)&&!/\b(explique|por que|porque|como funciona)\b/i.test(text)){
  setMode("thinking","CONSULTANDO DADOS");
  try{const r=await({weather:toolWeather,money:toolMoney,time:toolTime}[hits[0]])(text);cb(r);return{text:r,src:[]}}
  catch(e){const r="Não consegui consultar os dados agora. "+(e.message&&!/HTTP|abort|fetch/i.test(e.message)?e.message:"Verifique a conexão.");cb(r);return{text:r,src:[]}}
 }

 let web={ctx:"",src:[]};
 if(needWeb(text)){setMode("thinking","PESQUISANDO NA WEB");web=await gather(text)}
 setMode("thinking","PENSANDO");
 const now=new Date().toLocaleString("pt-BR",{dateStyle:"full",timeStyle:"short"});
 const content=web.ctx?"[WEB — coletado agora, "+now+"]\n"+web.ctx+"\n[/WEB]\n\nPergunta do usuário: "+text:text;
 const messages=[{role:"system",content:SYSTEM_PROMPT+" Agora: "+now+". Fuso: "+TZ+"."},...history.slice(-8),{role:"user",content}];
 const full=await streamAI(messages,cb,ctl);
 history.push({role:"user",content:text},{role:"assistant",content:full});
 history=history.slice(-12);store.set("history",history);
 return{text:full,src:web.src};
}

async function handleInput(raw){
 const text=String(raw||"").trim();if(!text||busy)return;
 busy=true;sendBtn.disabled=micBtn.disabled=true;
 addMsg("VOCÊ",text,"user");setMode("thinking","PROCESSANDO");
 const ctl=abortCtl=new AbortController(),t0=performance.now();let bub=null;
 const cb=t=>{
  if(!bub){bub=addMsg("JARVIS","");if(voiceOn){sayStart();setMode("speaking")}}
  bub.text+=t;bub.body.textContent=bub.text;scrollLog();sayFeed(t,false);
 };
 try{
  const r=await askAI(text,cb,ctl);lastReply=r.text;
  $("lat").textContent=Math.round(performance.now()-t0);$("led").classList.remove("off");$("net").textContent="ONLINE";
  sayFeed("",true);
  if(bub&&r.src?.length)addSources(bub.el,r.src);
 }catch(err){
  if(err.message==="STOP")return;
  $("led").classList.add("off");$("net").textContent="FALHA";
  if(bub)sayFeed("",true);else setMode("idle","FALHA NA CONEXÃO");
  addMsg("SISTEMA","Falha: "+(err.message||"não foi possível responder")+". Toque em ⚙ e depois em Diagnóstico.","sys");
 }finally{busy=false;sendBtn.disabled=micBtn.disabled=false}
}

/* ================= MICROFONE E ATIVAÇÃO POR NOME ================= */
async function ensureMic(){
 try{if(navigator.mediaDevices?.getUserMedia){const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop())}return true}
 catch(e){addMsg("SISTEMA","Permita o uso do microfone nas configurações do navegador.","sys");return false}
}
function startListening(){
 if(busy)return;
 if(wake){awaitCmd=true;awaitUntil=Date.now()+7000;stateEl.textContent="OUVINDO COMANDO";beep();return}
 if(!SR){addMsg("SISTEMA","Reconhecimento de voz indisponível. Abra esta página no Chrome.","sys");return}
 try{recognition?.abort()}catch(e){}
 if("speechSynthesis" in window)speechSynthesis.cancel();
 recognition=new SR();recognition.lang="pt-BR";recognition.interimResults=false;recognition.maxAlternatives=1;
 let heard=false;
 recognition.onstart=()=>setMode("listening");
 recognition.onresult=e=>{heard=true;handleInput(e.results[0][0].transcript)};
 recognition.onerror=e=>{
  if(e.error==="not-allowed"||e.error==="service-not-allowed")addMsg("SISTEMA","Acesso ao microfone bloqueado.","sys");
  else if(e.error==="network")addMsg("SISTEMA","Falha de rede no reconhecimento de voz.","sys");
 };
 recognition.onend=()=>{if(mode==="listening"&&!heard)setMode("idle")};
 try{recognition.start()}catch(e){setMode("idle")}
}
const WAKE_RX=/\b(?:jarvis|jarves|jarvi|javis|jervis|garvis|djarvis|charvis|xarvis|yarvis|jarbas|jarbis|jar vis|ja vis|charles|charley|charlie)\b/i;
function findWake(raw){
 const n=norm(raw);let best=null;const m=WAKE_RX.exec(n);
 if(m)best={i:m.index,l:m[0].length};
 for(const w of store.get("wakewords",[])){const k=norm(w).trim(),i=n.indexOf(k);if(k&&i>=0&&(!best||i<best.i))best={i,l:k.length}}
 return best;
}
async function keepScreen(on){
 try{
  if(on&&navigator.wakeLock&&!wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>wakeLock=null)}
  else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}
 }catch(e){}
}
function onWakeResult(e){
 for(let i=e.resultIndex;i<e.results.length;i++){
  const r=e.results[i];if(!r.isFinal)continue;
  let hit=null;
  for(let a=0;a<r.length;a++){const tx=r[a].transcript,f=findWake(tx);if(f){hit={tx,f};break}}
  if(mode==="speaking"){if(hit&&/\b(para|pare|silencio|stop)\b/i.test(norm(hit.tx.slice(hit.f.i+hit.f.l))))stopAll();continue}
  if(mode!=="idle"||busy||Date.now()<ignoreUntil)continue;
  if(hit){
   const cmd=hit.tx.slice(hit.f.i+hit.f.l).replace(/^[\s,.!?:;-]+/,"").trim();
   if(cmd.length>2)handleInput(cmd);
   else{awaitCmd=true;awaitUntil=Date.now()+7000;stateEl.textContent="OUVINDO COMANDO";beep()}
  }else if(awaitCmd&&Date.now()<awaitUntil){awaitCmd=false;handleInput(r[0].transcript)}
 }
}
function startWake(){
 if(!SR||!wake)return;
 try{wakeRec?.abort()}catch(e){}
 const r=new SR();wakeRec=r;r.lang="pt-BR";r.continuous=false;r.interimResults=false;r.maxAlternatives=3;
 r.onstart=()=>{if(mode==="idle"&&!awaitCmd)stateEl.textContent='AGUARDANDO "JARVIS"'};
 r.onresult=onWakeResult;
 r.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){wake=false;store.set("wake",false);syncBtns();addMsg("SISTEMA","Microfone bloqueado.","sys")}};
 r.onend=()=>{if(wakeRec===r&&wake)setTimeout(startWake,250)};
 try{r.start()}catch(e){setTimeout(startWake,1000)}
}
function syncBtns(){
 const set=(id,txt,on)=>{$(id).textContent=txt;$(id).classList.toggle("on",on)};
 set("wake",'Ativação "Jarvis": '+(wake?"on":"off"),wake);
 set("conv","Conversa contínua: "+(continuous?"on":"off"),continuous);
 set("voice","Voz: "+(voiceOn?"on":"off"),voiceOn);
}
syncBtns();

$("wake").onclick=async()=>{
 if(!SR){addMsg("SISTEMA","Abra esta página no Chrome para usar ativação por voz.","sys");return}
 if(!wake){
  if(!(await ensureMic()))return;
  wake=true;store.set("wake",true);continuous=false;store.set("continuous",false);syncBtns();
  await keepScreen(true);startWake();setMode("idle");beep();
 }else{
  wake=false;store.set("wake",false);syncBtns();await keepScreen(false);

 }

document.addEventListener("visibilitychange",()=>{if(!document.hidden&&wake){keepScreen(true);startWake()}});
$("conv").onclick=()=>{continuous=!continuous;store.set("continuous",continuous);syncBtns();if(continuous&&mode==="idle")startListening()};
$("voice").onclick=()=>{voiceOn=!voiceOn;store.set("voice",voiceOn);syncBtns();if(!voiceOn)stopAll()};
$("mic").onclick=()=>{if(mode==="listening"){try{recognition?.abort()}catch(e){}setMode("idle")}else startListening()};
$("send").onclick=()=>{const v=textEl.value;textEl.value="";handleInput(v)};
$("halt").onclick=stopAll;
textEl.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendBtn.click()}});
document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>handleInput(b.dataset.q));
$("gear").onclick=()=>{$("drawer").hidden=!$("drawer").hidden};
$("rate").value=rate;$("rate").oninput=e=>{rate=+e.target.value;store.set("rate",rate)};
$("repeat").onclick=()=>{if(lastReply&&voiceOn){sayStart();setMode("speaking");sayFeed(lastReply+" ",true)}};

const wave=$("wave"),bars=[];
for(let i=0;i<41;i++){const b=document.createElement("i");wave.appendChild(b);bars.push(b)}
const cv=$("bg"),cx=cv.getContext("2d"),stage=document.querySelector(".stage");let W=0,H=0,DPR=1,py=200,R=90;
function resize(){
 DPR=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);
 const s=stage.getBoundingClientRect();py=s.top+s.height*.4;R=Math.max(40,Math.min(W*.2,s.height*.3));
}
addEventListener("resize",resize);resize();
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
const N=innerWidth<500?300:480,pts=[];
for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*2.399963;pts.push([Math.cos(a)*r,y,Math.sin(a)*r])}
const COLORS={idle:[92,242,255],listening:[77,255,191],thinking:[138,107,255],speaking:[120,225,255]};
let col=[92,242,255],amp=0,spin=0,t=0;
function frame(){
 t+=.016;const target=COLORS[mode]||COLORS.idle;
 for(let i=0;i<3;i++)col[i]+=(target[i]-col[i])*.06;
 const goal=mode==="speaking"?.55+.45*Math.abs(Math.sin(t*9)*Math.sin(t*3.7)):mode==="listening"?.4:mode==="thinking"?.3:.08+.04*Math.sin(t*1.5);
 amp+=(goal-amp)*.12;spin+=mode==="thinking"?.03:mode==="idle"?.004:.012;
 const px=W/2;cx.clearRect(0,0,W,H);
 const c=col.map(v=>v|0).join(",");
 const g=cx.createRadialGradient(px,py,R*.2,px,py,R*2.5);g.addColorStop(0,`rgba(${c},${.14+amp*.16})`);g.addColorStop(1,`rgba(${c},0)`);
 cx.fillStyle=g;cx.fillRect(0,0,W,H);
 [[1.55,0,.5,[6,10]],[1.8,Math.PI/3,-.3,[2,14]],[2.1,0,.18,[60,18]]].forEach(([k,off,sp,dash],i)=>{
  cx.save();cx.translate(px,py);cx.rotate(off+t*sp);cx.strokeStyle=`rgba(${c},${.28-i*.06})`;cx.lineWidth=1;cx.setLineDash(dash);cx.beginPath();cx.arc(0,0,R*k,0,Math.PI*2);cx.stroke();cx.restore()
 });
 cx.setLineDash([]);cx.strokeStyle=`rgba(${c},.9)`;cx.lineWidth=2;cx.beginPath();cx.arc(px,py,R*1.35,t*1.4,t*1.4+.6+amp*1.4);cx.stroke();
 const cs=Math.cos(spin),sn=Math.sin(spin),ct=Math.cos(.35),st=Math.sin(.35),rad=R*(1+amp*.16);
 for(let i=0;i<N;i++){
  let[x,y,z]=pts[i];const wob=1+amp*.22*Math.sin(t*5+i*.37);x*=wob;y*=wob;z*=wob;
  const x1=x*cs+z*sn,z1=-x*sn+z*cs,y1=y*ct-z1*st,z2=y*st+z1*ct,p=1/(1.9-z2*.55);
  const sx=px+x1*rad*p*1.5,sy=py+y1*rad*p*1.5,a=.18+.82*((z2+1)/2),s=(.6+1.5*((z2+1)/2))*(1+amp*.5);
  cx.fillStyle=`rgba(${c},${a.toFixed(2)})`;cx.fillRect(sx-s/2,sy-s/2,s,s)
 }
 const cg=cx.createRadialGradient(px,py,0,px,py,R*.5);cg.addColorStop(0,`rgba(255,255,255,${.5+amp*.4})`);cg.addColorStop(.35,`rgba(${c},${.35+amp*.3})`);cg.addColorStop(1,`rgba(${c},0)`);
 cx.fillStyle=cg;cx.beginPath();cx.arc(px,py,R*.5,0,Math.PI*2);cx.fill();
 bars.forEach((b,i)=>{const m=Math.sin(i/bars.length*Math.PI),h=3+(mode==="idle"?1.5:18*amp*m*(.5+.5*Math.abs(Math.sin(t*7+i*.8))));b.style.height=h.toFixed(1)+"px";b.style.background=`rgb(${c})`;b.style.opacity=mode==="idle"?.35:.95});
 requestAnimationFrame(frame)
}
frame();
</script>
